<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Expense Tracker{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    form p { margin-bottom: 1rem; }
    form label { display: block; font-weight: 500; margin-bottom: .25rem; }
    form input[type=text], form input[type=number], form input[type=date],
    form input[type=month], form input[type=password], form select {
      width: 100%; padding: .5rem .75rem;
      border: 1px solid #ced4da; border-radius: .375rem;
    }
    .helptext, form ul { font-size: .85rem; color: #6c757d; }
    .errorlist { color: #dc3545; list-style: none; padding-left: 0; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'expense_list' %}">💰 Expense Tracker</a>
    {% if user.is_authenticated %}
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="{% url 'expense_list' %}">Expenses</a>
        <a class="nav-link" href="{% url 'summary' %}">Summary</a>
      </div>
      <span class="navbar-text me-3">Hi, {{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}" class="m-0">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
      </form>
    {% endif %}
  </div>
</nav>

<div class="container pb-5">
  {% block content %}{% endblock %}
</div>

</body>
</html>
