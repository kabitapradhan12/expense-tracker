{% extends 'base.html' %}
{% block title %}Delete expense{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h4 class="text-danger">Delete expense?</h4>
        <p>{{ expense.date }} | {{ expense.category }} | ₹{{ expense.amount }}</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a href="{% url 'expense_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
