{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">{{ title }}</h4>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary">Save</button>
          <a href="{% url 'expense_list' %}" class="btn btn-outline-secondary">Back</a>
        </form>
        <hr>
        <a href="{% url 'category_add' %}">+ New category</a>
        {% if expense %}
          <a href="{% url 'expense_delete' expense.pk %}" class="text-danger float-end">Delete this expense</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
